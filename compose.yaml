services:
  agent:
    build: .
    image: halyk-agent
    env_file: .env
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./data:/app/data:ro
      - ./.cache:/app/.cache
      - ./artifacts:/app/artifacts
      - ./out:/app/out
      - ./logs:/app/logs
    command: run
